<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Frontier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<link rel="stylesheet" href="game.css">
<div id="fx" class="fx">
  <header class="top" id="top">
    <div class="top-row">
      <div class="brand"><span class="lab">FRONTIER</span><span class="date num" id="t-date">01 JAN 2020</span><span class="clockstate" id="t-state">PAUSED</span></div>
      <div class="clock" role="group" aria-label="Game speed">
        <button type="button" class="tb" id="t-pause" aria-label="Pause (space)" title="Pause (space)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg></button>
        <button type="button" class="tb sp" data-speed="1" aria-label="Speed 1x: one day per second">1&times;</button>
        <button type="button" class="tb sp" data-speed="2" aria-label="Speed 2x">2&times;</button>
        <button type="button" class="tb sp" data-speed="4" aria-label="Speed 4x">4&times;</button>
        <button type="button" class="tb" id="t-mute" aria-label="Sound on. Press to mute (M)" title="Sound (M)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path class="w1" d="M11 5.5c1 .8 1 4.2 0 5" fill="none" stroke-width="1.4"/><path class="w2" d="M12.6 3.8c2 1.8 2 6.6 0 8.4" fill="none" stroke-width="1.4"/></svg></button>
      </div>
    </div>
    <div class="kpis" id="kpis">
      <div class="kpi"><span class="k">Cash</span><span class="v num" id="k-cash">$0</span></div>
      <div class="kpi"><span class="k">Burn</span><span class="v num" id="k-burn">$0</span></div>
      <div class="kpi" id="kpi-runway"><span class="k">Runway</span><span class="v num" id="k-runway">0</span></div>
      <div class="kpi"><span class="k">Reputation</span><span class="v num" id="k-rep">0</span></div>
      <div class="kpi"><span class="k">Compute</span><span class="v num" id="k-pf">0</span></div>
    </div>
    <div class="goal" id="goal">
      <span class="g-goal"><b>Goal</b> Reach 31 DEC 2020 &middot; beat GPT-3: 3.14e23</span>
      <span class="g-item" id="g-best">best &mdash;</span>
      <span class="g-item" id="g-forgot">forgotten in &mdash;</span>
      <span class="g-item" id="g-stake">stake 80%</span>
    </div>
    <nav class="jump" id="jump" aria-label="Jump to panel">
    <button type="button" data-jump="p-train">Train</button><button type="button" data-jump="p-team">Team</button><button type="button" data-jump="p-cluster">Cluster</button><button type="button" data-jump="p-data">Data</button><button type="button" data-jump="p-money">Money</button><button type="button" data-jump="p-rivals">Rivals</button><button type="button" data-jump="p-news">News</button>
  </nav>
  </header>
  <main class="grid" id="grid">
    <section class="panel p-train open" id="p-train" aria-label="Training">
      <h2 class="ph"><span class="pt">Training</span><span class="ps" id="s-train"></span></h2>
      <div class="pbody train-body">
        <div class="chartwrap" id="chartwrap"><canvas id="chart" aria-label="Loss against compute: the scaling line, your runs, rivals and GPT-3" role="img"></canvas><div class="chart-cap" id="chart-cap"></div></div>
        <div class="runbar" id="runbar"></div>
        <div class="model" id="model" aria-live="polite"><div class="model-meta" id="model-meta">THE MODEL</div><p class="model-text" id="model-text"></p></div>
        <div class="designer" id="designer">
          <div class="dz-head"><span class="dz-title">Next run</span><label class="recipe"><input type="checkbox" id="d-recipe" checked> tokens follow the recipe</label></div>
          <div class="dz-sliders">
            <label class="sl"><span class="sl-k">Model size</span><span class="sl-v num" id="d-params-v"></span><input type="range" id="d-params" min="0" max="1000" step="1" aria-label="Model size in parameters"></label>
            <label class="sl"><span class="sl-k">Tokens</span><span class="sl-v num" id="d-tokens-v"></span><input type="range" id="d-tokens" min="0" max="1000" step="1" aria-label="Training tokens"></label>
            <div class="sl sl-pool"><span class="sl-k">Cards</span><span class="sl-v num" id="d-gpus-v"></span><div class="chips" id="d-pools" role="group" aria-label="Which cards"></div><input type="range" id="d-gpus" min="1" max="8" step="1" aria-label="How many cards"></div>
          </div>
          <div class="dz-read" id="d-read"></div>
          <ul class="dz-warn" id="d-warn"></ul>
          <div class="dz-go"><button type="button" class="btn primary" id="d-launch">Launch run</button><span class="dz-note" id="d-note"></span></div>
        </div>
      </div>
    </section>
    <section class="panel p-team" id="p-team" aria-label="Team"><h2 class="ph"><button type="button" class="ph-btn" aria-expanded="false"><span class="pt">Team</span><span class="ps" id="s-team"></span></button></h2><div class="pbody" id="b-team"></div></section>
    <section class="panel p-cluster" id="p-cluster" aria-label="Cluster"><h2 class="ph"><button type="button" class="ph-btn" aria-expanded="false"><span class="pt">Cluster</span><span class="ps" id="s-cluster"></span></button></h2><div class="pbody" id="b-cluster"></div></section>
    <section class="panel p-data" id="p-data" aria-label="Data"><h2 class="ph"><button type="button" class="ph-btn" aria-expanded="false"><span class="pt">Data</span><span class="ps" id="s-data"></span></button></h2><div class="pbody" id="b-data"></div></section>
    <section class="panel p-money" id="p-money" aria-label="Money"><h2 class="ph"><button type="button" class="ph-btn" aria-expanded="false"><span class="pt">Money</span><span class="ps" id="s-money"></span></button></h2><div class="pbody" id="b-money"></div></section>
    <section class="panel p-rivals" id="p-rivals" aria-label="Rivals"><h2 class="ph"><button type="button" class="ph-btn" aria-expanded="false"><span class="pt">Rivals</span><span class="ps" id="s-rivals"></span></button></h2><div class="pbody" id="b-rivals"></div></section>
    <section class="panel p-news" id="p-news" aria-label="News and inbox"><h2 class="ph"><button type="button" class="ph-btn" aria-expanded="false"><span class="pt">News &amp; inbox</span><span class="ps" id="s-news"></span></button></h2><div class="pbody" id="b-news"></div></section>
  </main>
  <div class="scrim" id="scrim" hidden></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" hidden></div>
  <div class="endcard" id="end" role="dialog" aria-modal="true" aria-labelledby="e-head" hidden></div>
</div>
<script src="config.js"></script>
<script src="corpus.js"></script>
<script src="world.js"></script>
<script src="engine.js"></script>
<script src="audio.js"></script>
<script src="ui.js"></script>

</body>
</html>
