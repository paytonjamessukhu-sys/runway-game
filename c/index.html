<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Frontier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<link rel="stylesheet" href="game.css?v=1792001355">
<div id="fx" class="fx" role="application" aria-label="Frontier. A lab on one sheet of grey paper.">
  <!-- THE TOP: the lab, the date and the clock on the left; the goal in the middle on a laptop; MONEY in the top right corner -->
  <header class="top" id="top">
    <div class="tl">
      <div class="dl"><span class="lab">FRONTIER</span><span class="sep"> &middot; </span><span class="date num"><span id="t-date">01 JAN</span><span class="yr" id="t-yr"> 2020</span></span></div>
      <button type="button" class="month" id="t-month" aria-haspopup="true" aria-expanded="false" aria-controls="ledger" title="The monthly slips"><span id="t-m">month 1 of 12</span><i class="pip" id="t-pip" hidden></i></button>
      <div class="clock" role="group" aria-label="Time and sound">
        <button type="button" class="tb" id="t-pause" aria-label="Pause (space)" title="Pause (space)"><svg viewBox="0 0 16 16" aria-hidden="true"><g class="ic-pause"><rect x="3" y="2.5" width="3.2" height="11"/><rect x="9.8" y="2.5" width="3.2" height="11"/></g><path class="ic-play" d="M4 2.4v11.2L13.2 8z"/></svg></button>
        <button type="button" class="tb sp" data-speed="1" aria-label="Normal speed: one day per second">1&times;</button>
        <button type="button" class="tb sp" data-speed="2" aria-label="Double speed">2&times;</button>
        <button type="button" class="tb snd" id="t-mute" aria-label="Sound on. Press to mute (M)" title="Sound (M)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path class="w1" d="M11 5.5c1 .8 1 4.2 0 5" fill="none"/><path class="w2" d="M12.6 3.8c2 1.8 2 6.6 0 8.4" fill="none"/></svg></button>
      </div>
      <div class="short" id="f-short"><span class="sv num" id="v-short">&mdash;</span><span class="sk">short of GPT-3</span><span class="tg" id="g-short">no model yet</span></div>
    </div>

    <section class="ladder" id="ladder" aria-label="Your goals">
      <div class="rungs" id="rungs"></div>
      <div class="lbar" id="lbar"><i id="lbar-i"></i></div>
      <div class="lnote" id="lnote"></div>
    </section>

    <button type="button" class="money" id="money" aria-controls="r-money" aria-expanded="false" aria-label="Money. Tap to open the books.">
      <span class="mk">CASH<i class="mcar" aria-hidden="true"></i></span>
      <span class="fig" id="f-cash"><span class="mv num" id="v-cash">$0</span><span class="arrow" id="a-cash" aria-hidden="true"></span></span>
      <span class="tg num" id="g-cash">&nbsp;</span>
      <span class="mstats"><span class="mrow" id="f-broke"><b class="num" id="v-broke">0</b><span class="ml"> months until broke</span><span class="tg num" id="g-broke">&nbsp;</span></span>
      <span class="mrow own" id="f-own"><span class="ml">your lab owns </span><b class="num" id="v-own">$0</b><span class="tg num" id="g-own">&nbsp;</span></span>
      <span class="hint" id="m-hint"></span></span>
    </button>
    <div class="ledger" id="ledger" role="region" aria-label="The monthly slips" hidden></div>
  </header>

  <!-- THE MIDDLE: the paper. Phone: one scrolling stack. Laptop: margin rows left and right of the sheet. -->
  <main class="mid" id="mid">
    <section class="paper" id="curve" aria-label="The paper">
      <div class="chartwrap" id="chartwrap">
        <canvas id="chart" role="img" aria-label="Error score against compute, on log paper: the line you should land on, your saved models, rival labs and GPT-3"></canvas>
        <ol class="people" id="people" aria-label="Your people. Press a name for their note."></ol>
        <div class="voice" id="voice" aria-live="polite"></div>
        <div class="slip" id="slip" role="status" hidden></div>
      </div>
      <div class="runbar" id="runbar"></div>
      <div class="model" id="model" aria-live="polite"><div class="model-meta" id="model-meta"></div><p class="model-text" id="model-text"></p></div>
      <div class="forgot" id="forgot"></div>
    </section>

    <div class="col col-l">
      <section class="fold" id="r-team" data-row="team"><h2 class="row-h"><button type="button" class="row-btn" aria-expanded="false"><span class="row-t">Team</span></button><div class="row-s" id="s-team"></div><i class="row-chev" aria-hidden="true"></i></h2><div class="row-b" id="b-team"></div></section>
      <section class="fold" id="r-money" data-row="money"><h2 class="row-h"><button type="button" class="row-btn" aria-expanded="false"><span class="row-t">Money</span></button><div class="row-s" id="s-money"></div><i class="row-chev" aria-hidden="true"></i></h2><div class="row-b" id="b-money"></div></section>
      <section class="fold" id="r-data" data-row="data"><h2 class="row-h"><button type="button" class="row-btn" aria-expanded="false"><span class="row-t">Data</span></button><div class="row-s" id="s-data"></div><i class="row-chev" aria-hidden="true"></i></h2><div class="row-b" id="b-data"></div></section>
    </div>
    <div class="col col-r">
      <section class="fold" id="r-cluster" data-row="cluster"><h2 class="row-h"><button type="button" class="row-btn" aria-expanded="false"><span class="row-t">Cluster</span></button><div class="row-s" id="s-cluster"></div><i class="row-chev" aria-hidden="true"></i></h2><div class="row-b" id="b-cluster"></div></section>
      <section class="fold" id="r-rivals" data-row="rivals" hidden><h2 class="row-h"><button type="button" class="row-btn" aria-expanded="false"><span class="row-t">Rivals and news</span></button><div class="row-s" id="s-rivals"></div><i class="row-chev" aria-hidden="true"></i></h2><div class="row-b" id="b-rivals"></div></section>
    </div>
  </main>

  <!-- THE BOTTOM: always on screen. The cluster as a strip of cells, then OPTIONS (left) and THE MODELS WE BUILD (right). -->
  <footer class="deck" id="deck">
    <div class="cellsrow" id="cellsrow"><span class="clab"><span class="pn" id="cells-l">CARDS: our GPUs</span><span class="cn num" id="cells-n">8</span></span><canvas id="cells" aria-hidden="true"></canvas></div>
    <div class="band" id="band">
      <section class="opts-sec" id="opts-sec" aria-label="Options">
        <h2 class="bh"><span class="bt">OPTIONS</span><span class="bn" id="opts-n"></span></h2>
        <div class="opts" id="opts">
          <article class="opt run" id="opt-run">
            <div class="o-h"><span class="o-t"><span class="lg-only">Your next run</span><span class="sh-only">Next run</span></span><div class="presets" id="d-presets" role="group" aria-label="Quick runs"></div></div>
            <div class="dz-read" id="d-read"></div>
            <p class="o-e" id="d-note"></p>
            <div class="o-f"><button type="button" class="btn primary" id="d-launch">Start this run</button><button type="button" class="btn link" id="d-tune" aria-expanded="false" aria-controls="tune">Tune it</button></div>
          </article>
          <div class="opts-dyn" id="opts-dyn"></div>
        </div>
      </section>
      <section class="shelf-sec" id="shelf-sec" aria-label="The models we build">
        <h2 class="bh"><span class="bt">THE MODELS WE BUILD</span><span class="bn" id="shelf-n">none yet</span></h2>
        <div class="shelf" id="shelf"><div class="dc" id="shelf-done"></div><div class="dc" id="shelf-live"></div></div>
      </section>
    </div>
  </footer>

  <!-- sheets: letters, offers, the run designer and a saved model's card all slide up from the bottom -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet tune" id="tune" aria-label="Tune the next run" hidden>
    <div class="sh-h"><span class="o-t">Tune the next run</span><button type="button" class="btn link" id="tune-x">Done</button></div>
    <div class="dz-sliders" id="d-sliders">
      <label class="sl"><span class="sl-k">Model size</span><span class="sl-v num" id="d-params-v"></span><input type="range" id="d-params" min="0" max="1000" step="1" aria-label="Model size: bigger learns more and trains slower"></label>
      <label class="sl"><span class="sl-k">Text to read</span><span class="sl-v num" id="d-tokens-v"></span><input type="range" id="d-tokens" min="0" max="1000" step="1" aria-label="Text to read, in tokens"></label>
      <div class="sl"><span class="sl-k">Cards</span><span class="sl-v num" id="d-gpus-v"></span><input type="range" id="d-gpus" min="1" max="8" step="1" aria-label="How many cards"></div>
      <div class="chips" id="d-pools" role="group" aria-label="Which cards"></div>
      <label class="recipe"><input type="checkbox" id="d-recipe" checked> match the text to the model size (the 2020 recipe)</label>
    </div>
    <ul class="dz-warn" id="d-warn"></ul>
    <details class="dz-detail" id="d-detail"><summary>The numbers behind it</summary><div id="d-detail-b"></div></details>
  </section>
  <div class="modal sheet" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" hidden></div>
  <div class="floats" id="floats" aria-hidden="true"></div>
  <div class="endcard" id="end" role="dialog" aria-modal="true" aria-labelledby="e-head" hidden></div>
</div>
<script src="config.js?v=1792001355"></script>
<script src="corpus.js?v=1792001355"></script>
<script src="world.js?v=1792001355"></script>
<script src="engine.js?v=1792001355"></script>
<script src="audio.js?v=1792001355"></script>
<script src="fx.js?v=1792001355"></script>
<script src="strip.js?v=1792001355"></script>
<script src="chart.js?v=1792001355"></script>
<script src="cells.js?v=1792001355"></script>
<script src="designer.js?v=1792001355"></script>
<script src="rows.js?v=1792001355"></script>
<script src="options.js?v=1792001355"></script>
<script src="main.js?v=1792001355"></script>

</body>
</html>
