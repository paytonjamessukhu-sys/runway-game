<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Frontier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<link rel="stylesheet" href="game.css">
<div id="fr">
  <canvas id="fr-cv" aria-hidden="true"></canvas>
  <div id="fr-focus" tabindex="0" role="application" aria-label="Frontier, a 2020 AI lab. Touch or press Enter to power the sheet. Left and right arrows move the nib along the bet strip, Enter or Space lifts it and launches the run, S pulls a sample while it trains. When a letter arrives, Up takes it and Down lets it pass. P publishes the landing sample, Right ships it. Keys 1 to 9 press the names in the margin."></div>
  <div id="fr-top" aria-hidden="true">
    <div id="fr-date"><span id="fr-brand" class="g">FRONTIER</span><span class="g"> &middot; </span><span id="fr-today"></span><span id="fr-hour"></span><span id="fr-bought"></span></div>
    <div id="fr-months"><span id="fr-proj"></span><b id="fr-mn"></b><i id="fr-ml">MONTHS</i></div>
  </div>
  <div id="fr-names" role="group" aria-label="Your people"></div>
  <div id="fr-notes" aria-hidden="true"></div>
  <div id="fr-boxes" aria-hidden="true"></div>
  <div id="fr-heads" aria-hidden="true"></div>
  <div id="fr-band" aria-hidden="true"><p id="fr-sample"></p></div>
  <div id="fr-count" aria-hidden="true"></div>
  <div id="fr-readout" aria-hidden="true"></div>
  <div id="fr-dim" aria-hidden="true"></div>
  <canvas id="fr-hi" aria-hidden="true"></canvas>
  <div id="fr-moment" aria-hidden="true"><p id="fr-moment-text"></p></div>
  <div id="fr-letter" tabindex="-1" role="dialog" aria-live="assertive" hidden>
    <div class="fuse"><i></i></div>
    <p class="from"></p>
    <p class="offer"></p>
    <p class="eff"><span class="up"></span><span class="down"></span></p>
  </div>
  <button id="fr-mute" type="button" aria-pressed="false">SOUND ON</button>
  <div id="fr-safe" aria-hidden="true"></div>
  <div id="fr-live" class="fr-sr" aria-live="polite"></div>
</div>
<script src="config.js"></script>
<script src="rules.js"></script>
<script src="content.js"></script>
<script src="corpus.js"></script>
<script src="game.js"></script>

</body>
</html>
